<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Rooms main UI · demo data</title>
<style>
:root{--ds-bg-primary:#fff;--ds-bg-secondary:#f9f9f9;--ds-text-primary:#1a1c1f;--ds-text-secondary:#555;--ds-text-muted:#666;--ds-text-faint:#aaa;--ds-border-default:#e2e2e2;--ds-border-strong:#ccc;--ds-bg-hover:#eee;--ds-bg-active:#e4e4e4;--ds-focus:#315fb1;--ds-danger:#a33030;--ds-success:#326b46;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:root[data-dark]{--ds-bg-primary:#181818;--ds-bg-secondary:#212121;--ds-text-primary:#f2f2f2;--ds-text-secondary:#bbb;--ds-text-muted:#aaa;--ds-border-default:#333;--ds-border-strong:#555;--ds-bg-hover:#303030;--ds-bg-active:#383838;--ds-focus:#92b8ff;--ds-danger:#f6a3a3}
body{margin:0;background:var(--ds-bg-primary);color:var(--ds-text-primary)}.demo-tools{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--ds-bg-secondary);border-bottom:1px solid var(--ds-border-default);align-items:center}.demo-tools button{font:inherit;padding:4px 8px;background:var(--ds-bg-primary);color:inherit;border:1px solid var(--ds-border-strong);border-radius:6px;cursor:pointer}:focus-visible{outline:2px solid var(--ds-focus);outline-offset:3px}.demo-shell{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100vh - 50px)}aside{padding:12px;background:var(--ds-bg-secondary);border-right:1px solid var(--ds-border-default);overflow:auto}.sidebar-list-label{font-size:12px;color:var(--ds-text-muted)}.thread-item{display:flex;border-radius:6px}.thread-item.active{background:var(--ds-bg-active)}.thread-item:hover{background:var(--ds-bg-hover)}.thread-item-main{display:flex;align-items:center;gap:4px;padding:6px 12px}.demo-native{padding:24px}#page{min-width:0;min-height:0}.demo-category{padding:12px 4px;color:var(--ds-text-muted)}@media(max-width:650px){.demo-shell{grid-template-columns:170px minmax(0,1fr)}aside{padding:8px}}@media(max-width:420px){.demo-shell{grid-template-columns:132px minmax(0,1fr)}}
</style>

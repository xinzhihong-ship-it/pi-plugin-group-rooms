<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="pi-plugin-chrome" content="v2"><title>群组房间 / Group Rooms</title><link rel="stylesheet" href="style.css"></head>
<body data-view="management"><main>
<header><div><h1 data-zh="群组房间" data-en="Group Rooms">群组房间</h1><p data-zh="创建或加入房间，在原生会话中聊天。" data-en="Create or join a room. Chat in the native session.">创建或加入房间，在原生会话中聊天。</p></div><button id="refresh" data-zh="刷新" data-en="Refresh">刷新</button></header>
<div id="notice" class="message" role="status" aria-live="polite"></div>
<section class="section"><h2 data-zh="这台电脑" data-en="This computer">这台电脑</h2><div class="stack"><label><span data-zh="成员名称" data-en="Member name">成员名称</span><input id="identity" required maxlength="256" autocomplete="nickname"></label><p class="small" data-zh="每台电脑一个身份；助手能力属于该成员。" data-en="One identity per computer. Agent access belongs to that member.">每台电脑一个身份；助手能力属于该成员。</p><p id="listener-status" class="small" role="status" data-zh="创建房间后自动接收连接" data-en="Receiving starts with a created room">创建房间后自动接收连接</p></div></section>
<section class="section"><div class="tabs" aria-label="创建或加入 / Create or join"><button id="create-tab" aria-pressed="true" aria-controls="create-form" data-zh="创建房间" data-en="Create room">创建房间</button><button id="join-tab" aria-pressed="false" aria-controls="join-form" data-zh="加入房间" data-en="Join room">加入房间</button></div>
<form id="create-form" class="stack"><label><span data-zh="房间名称" data-en="Room name">房间名称</span><input name="name" required maxlength="256"></label><label><span data-zh="其他电脑可连接的地址" data-en="Address other computers can reach">其他电脑可连接的地址</span><input name="address" placeholder="192.168.1.10" required autocomplete="off"></label><div class="stack"><label><span data-zh="这台电脑的项目文件夹" data-en="Project folder on this computer">这台电脑的项目文件夹</span><input id="create-path" readonly required></label><div class="actions"><button type="button" id="choose-create" data-zh="选择文件夹…" data-en="Choose folder…">选择文件夹…</button></div></div><p class="small" data-zh="选择本地可访问的文件夹；NAS 请先挂载，再选择挂载路径。不会自动下载项目。" data-en="Choose a locally accessible folder. Mount your NAS first, then select its mounted path. Projects are not downloaded.">选择本地可访问的文件夹；NAS 请先挂载，再选择挂载路径。不会自动下载项目。</p><p id="create-help" class="small" data-zh="创建房间时会自动开始接收连接，其他电脑才能连上这台电脑。" data-en="Creating a room starts incoming connections automatically, so other computers can reach this one.">创建房间时会自动开始接收连接，其他电脑才能连上这台电脑。</p><div class="actions"><button type="submit" class="primary" id="create-submit" disabled data-zh="创建房间" data-en="Create room">创建房间</button></div></form>
<form id="join-form" class="stack" hidden><label><span data-zh="邀请内容" data-en="Invitation">邀请内容</span><textarea name="invitation" required spellcheck="false" autocomplete="off"></textarea></label><label><span data-zh="这台电脑的项目文件夹" data-en="Project folder on this computer">这台电脑的项目文件夹</span><input id="join-path" readonly required></label><div class="actions"><button type="button" id="choose-join" data-zh="选择文件夹…" data-en="Choose folder…">选择文件夹…</button></div><p class="small" data-zh="每个成员选择自己的本地路径。NAS 请先挂载；不会自动下载项目。" data-en="Each member chooses their own local path. Mount your NAS first; projects are not downloaded.">每个成员选择自己的本地路径。NAS 请先挂载；不会自动下载项目。</p><div class="actions"><button type="submit" class="primary" id="join-submit" disabled data-zh="加入房间" data-en="Join room">加入房间</button></div></form></section>
<section id="invitation-section" class="section" hidden><h2 data-zh="邀请成员" data-en="Invite members">邀请成员</h2><p data-zh="将邀请内容发送给要加入的成员。" data-en="Share this invitation with the members you want to join.">将邀请内容发送给要加入的成员。</p><label><span data-zh="邀请内容" data-en="Invitation">邀请内容</span><textarea id="invitation-output" readonly spellcheck="false"></textarea></label><div class="actions" style="margin-top:12px"><button id="select-invitation" data-zh="选中邀请内容" data-en="Select invitation">选中邀请内容</button><button id="close-invitation" data-zh="收起" data-en="Dismiss">收起</button></div></section>
<section class="section"><h2 data-zh="我的房间" data-en="My rooms">我的房间</h2><div id="rooms" aria-busy="true"><p data-zh="正在加载…" data-en="Loading…">正在加载…</p></div></section>
<p class="small" data-zh="在会话输入框中使用 @成员 或 @all；模型与思考级别在房间成员中设置。" data-en="Use @member or @all in the native composer. Set models and thinking levels in Room members.">在会话输入框中使用 @成员 或 @all；模型与思考级别在房间成员中设置。</p>
</main><script type="module" src="panel.mjs"></script></body></html>
